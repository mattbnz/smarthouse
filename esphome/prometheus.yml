# Snippet to merge into prometheus.yml: scrapes ESPHome nodes directly.
# Replaces the existing "water" job (which scraped the smarthouse receiver),
# keeping the job name so water.rules.yml (job="water") keeps matching.
#
# ESPHome exports esphome_sensor_value{id="flow_rate",node="pumpmon-farm",...}.
# The metric_relabel_configs below map that back to the series the old
# smarthouse receiver produced, mL_per_min{node="pumpmon",flow="farm"} and
# total_mL{...}, so existing dashboards keep working. total_mL resets on node
# reboot; use increase()/rate() which handle counter resets.
scrape_configs:
  - job_name: water
    scrape_interval: 15s
    static_configs:
      - targets:
          - 10.230.2.233:80  # pumpmon-house
          - 10.230.2.230:80  # pumpmon-farm
          # Old smarthouse receiver: keep only until both nodes run ESPHome;
          # it keeps exporting a node's last value after the node stops
          # reporting to it.
          - 10.230.2.242:1510
    metric_relabel_configs:
      - source_labels: [__name__, id]
        regex: esphome_sensor_value;flow_rate
        target_label: __name__
        replacement: mL_per_min
      - source_labels: [__name__, id]
        regex: esphome_sensor_value;flow_total
        target_label: __name__
        replacement: total_mL
      # node="pumpmon-farm" => node="pumpmon", flow="farm"
      - source_labels: [node]
        regex: "pumpmon-(.+)"
        target_label: flow
      - source_labels: [node]
        regex: "(pumpmon)-.+"
        target_label: node

