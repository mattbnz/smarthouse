# Shared config for all ESP8266 (Wemos D1 mini style) nodes.
#
# Works on all three board variants in use:
#  - D1 mini with ESP-12F (ESP8266MOD) can, 4MB flash
#  - D1 mini Pro ("rainsun" ceramic chip antenna + u.FL/SMA), 16MB flash
#  - D1 mini clone with bare ESP8266EX mounted diagonally, PCB antenna
# A 4MB image runs on all of them, and pin names (D5 etc.) are identical.
#
# Expects substitutions: name, friendly_name

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini
  # DOUT is slowest but works with the mismatched flash chips found on clones.
  board_flash_mode: dout
  # Don't persist entity state to flash (avoids wear; Prometheus handles
  # counter resets).
  restore_from_flash: false

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains powered: keep the radio fully awake for reliable connections.
  power_save_mode: none
  # Reboot if WiFi has been down this long.
  reboot_timeout: 15min
  # Fallback AP for recovery (e.g. SSID/password change) if WiFi fails.
  ap:
    ssid: ${name}-fallback
    password: !secret fallback_ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# Boots into a minimal OTA-only mode after repeated boot failures.
safe_mode:

# Serves /metrics (prometheus) and a status page on port 80.
web_server:
  port: 80

prometheus:

# Onboard LED (GPIO2): blinks on errors / no WiFi.
status_led:
  pin:
    number: D4
    inverted: true

debug:
  update_interval: 60s

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Heap free

text_sensor:
  - platform: version
    name: ESPHome version
    hide_timestamp: true
  - platform: debug
    reset_reason:
      name: Reset reason
  - platform: wifi_info
    ip_address:
      name: IP address
    bssid:
      name: BSSID
